<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face & Fish Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f4f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    button {
      background-color: #0078ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #005fcc;
    }

    #webcam-container {
      margin-top: 20px;
    }

    .slider-container {
      margin: 20px auto;
      width: 300px;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
    }

    #label-container {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <h1>Teachable Machine - Face & Fish Classifier</h1>

  <button onclick="init()">Start Camera</button>

  <div id="webcam-container"></div>

  <div class="slider-container">
    <label for="threshold">
      Confidence Threshold: <span id="threshold-value">0.80</span>
    </label>
    <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.80" />
  </div>

  <div id="label-container"></div>

  <script>
    const URL = "./my_model/";
    let model, webcam, labelContainer, maxPredictions;
    let threshold = 0.8;

    // Update threshold dynamically when user moves the slider
    document.getElementById("threshold").addEventListener("input", (e) => {
      threshold = parseFloat(e.target.value);
      document.getElementById("threshold-value").innerText = threshold.toFixed(2);
    });

    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      const flip = true;
      webcam = new tmImage.Webcam(200, 200, flip);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      document.getElementById("webcam-container").appendChild(webcam.canvas);
      labelContainer = document.getElementById("label-container");
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        const prob = prediction[i].probability;
        const className = prediction[i].className;
        const labelDiv = labelContainer.childNodes[i];
        labelDiv.innerHTML = `${className}: ${(prob * 100).toFixed(2)}%`;

        if (prob >= threshold) {
          labelDiv.style.color = "green";
          labelDiv.style.fontWeight = "bold";
        } else {
          labelDiv.style.color = "#555";
          labelDiv.style.fontWeight = "normal";
        }
      }
    }
  </script>
</body>
</html>
