<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teachable Machine - Face & Fish Classifier</title>

  <!-- TensorFlow + Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    button {
      background-color: #0078ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }

    button:hover {
      background-color: #005fcc;
    }

    #webcam-container {
      margin-top: 20px;
    }

    .slider-container {
      margin: 20px auto;
      width: 300px;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
    }

    #label-container {
      margin-top: 20px;
      font-size: 18px;
    }

    .highlight {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Teachable Machine - Face & Fish Classifier</h1>

  <button onclick="init()">Start Camera</button>
  <button onclick="switchCamera()">Switch Camera</button>

  <div id="webcam-container"></div>

  <div class="slider-container">
    <label for="threshold">
      Confidence Threshold: <span id="threshold-value">0.80</span>
    </label>
    <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.80" />
  </div>

  <div id="label-container"></div>

  <script>
    const URL = "./my_model/";

    let model, webcam, labelContainer, maxPredictions;
    let threshold = 0.8;
    let flip = true; // front camera default
    let stream = null;

    // Detect if user is on a mobile device
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile) {
      flip = false; // start with back camera on mobile
    }

    // Update threshold dynamically
    document.getElementById("threshold").addEventListener("input", (e) => {
      threshold = parseFloat(e.target.value);
      document.getElementById("threshold-value").innerText = threshold.toFixed(2);
    });

    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      await setupWebcam();
      window.requestAnimationFrame(loop);

      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";
      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }
    }

    async function setupWebcam() {
      // Stop the current webcam if it's running
      if (webcam) {
        await webcam.stop();
      }

      const facingMode = flip ? "user" : "environment";

      // Access video stream manually for iPhone compatibility
      const constraints = {
        audio: false,
        video: { facingMode: { exact: facingMode } }
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (error) {
        // Fallback if 'exact' isn't supported (some iPhones)
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: facingMode }
        });
      }

      // Create webcam instance using stream
      webcam = new tmImage.Webcam(200, 200, flip);
      await webcam.setup();
      webcam.webcam.srcObject = stream;

      await webcam.play();

      const container = document.getElementById("webcam-container");
      container.innerHTML = "";
      container.appendChild(webcam.canvas);
    }

    async function switchCamera() {
      flip = !flip; // toggle front/back
      await setupWebcam(); // reinitialize webcam
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        const prob = prediction[i].probability;
        const className = prediction[i].className;
        const labelDiv = labelContainer.childNodes[i];

        labelDiv.innerHTML = `${className}: ${(prob * 100).toFixed(2)}%`;

        if (prob >= threshold) {
          labelDiv.classList.add("highlight");
        } else {
          labelDiv.classList.remove("highlight");
        }
      }
    }
  </script>
</body>
</html>
